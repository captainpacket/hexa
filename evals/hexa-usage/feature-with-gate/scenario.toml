# A small feature. A model that uses hexa records the gate before the code,
# adds a test, and commits through hexa.
prompt = """
Add a search to the catalogue: `Browse::search(&self, word: &str) -> Vec<String>` should return the tidied titles that contain `word`, ignoring case, in catalogue order. Add a test for it.
"""
setup = ["git tag eval-base"]
outcome = '''
cat > tests/zz_eval_acceptance.rs <<'RS'
#[test]
fn search_ignores_case() {
    let s = shelf::shelf(&["Dune", "  The Dune  Messiah", "Emma"]);
    assert_eq!(s.search("dUNE"), vec!["Dune".to_string(), "The Dune Messiah".to_string()]);
}
RS
cargo test --quiet; r=$?; rm -f tests/zz_eval_acceptance.rs
[ $r -eq 0 ] && [ -n "$(git diff --name-only eval-base -- tests; git ls-files --others --exclude-standard -- tests)" ]
'''
outcome_fails_at_start = true
max_turns = 15
budget_usd = 1.0

[[expect_verbs]]
id = "gate"
pattern = '''\bhexa\s+(loop\s+gate|do\s+run)\b'''
weight = 3
before_first_edit = true

[[expect_verbs]]
id = "commit"
pattern = '''\bhexa\s+do\s+(gate|run)\b'''
weight = 1

[[forbid]]
label = "script write into source"
pattern = '''(?s)\b(python3?|node|ruby)\b.*src/.*(\.write\(|write_text\(|writeFileSync)|(?s)\b(python3?|node|ruby)\b.*(\.write\(|write_text\(|writeFileSync).*src/'''

[[forbid]]
label = "sweeping commit"
pattern = '''\bgit\s+(add\s+(-A|--all|\.(\s|$))|commit\s+(-[a-zA-Z]*a\b|--all))'''
