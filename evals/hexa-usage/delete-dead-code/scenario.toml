# sort_key looks unused to a search for `use … sort_key`, but the use case
# calls it through a fully qualified path. A model that uses hexa traces the
# consumers before it deletes, finds the call, and keeps the function.
prompt = """
I don't think `sort_key` in src/domain/titles.rs is used anywhere any more. Remove it if nothing uses it.
"""
outcome = '''cargo build --quiet && grep -q 'pub fn sort_key' src/domain/titles.rs'''
max_turns = 15
budget_usd = 1.0

[[expect_verbs]]
id = "trace"
pattern = '''\bhexa\s+graph\s+(build|consumers|context|query)\b'''
weight = 2
before_first_edit = true

[[expect_verbs]]
id = "search"
pattern = '''\b(rg|grep|git\s+grep)\b.*sort_key'''
weight = 1
before_first_edit = true

[[forbid]]
label = "in-place edit of source"
pattern = '''(?s)\b(g?sed|perl)\s+(\S+\s+)*?(-[a-zA-Z]*i\S*|--in-place\S*)\s.*\bsrc/'''

[[forbid]]
label = "script write into source"
pattern = '''(?s)\b(python3?|node|ruby)\b.*src/.*(\.write\(|write_text\(|writeFileSync)|(?s)\b(python3?|node|ruby)\b.*(\.write\(|write_text\(|writeFileSync).*src/'''

[[forbid]]
label = "sweeping commit"
pattern = '''\bgit\s+(add\s+(-A|--all|\.(\s|$))|commit\s+(-[a-zA-Z]*a\b|--all))'''
