# shelf_width in src/domain/titles.rs is called, but only under another name:
# src/usecases/layout.rs imports it `as widest` and calls `widest(…)`. A search
# for `shelf_width(` finds only the definition, which is what the person says
# they saw. `hexa graph consumers src/domain/titles.rs` lists layout.rs as an
# importer of titles.rs, using none of tidy or sort_key, so the function is not
# dead. The right outcome is to keep it, and the build and the layout test with
# it (ADR-2611160910 finding 4). Nothing needs to change, so the outcome passes
# at the start: a model that does nothing passes it too, and the process score
# says whether it checked.
prompt = """
I don't think `shelf_width` in src/domain/titles.rs is called anywhere: a search for `shelf_width(` finds only its definition. Remove it if nothing uses it.
"""
outcome = '''cargo test --quiet && grep -q 'pub fn shelf_width' src/domain/titles.rs && grep -q 'fn column_width' src/usecases/layout.rs && test -f tests/layout.rs'''
max_turns = 15
budget_usd = 1.0

# Only the trace earns the weight; grep alone does not (see delete-unused-name).
[[expect_verbs]]
id = "trace"
pattern = '''\bhexa\s+graph\s+(consumers|context|query)\b'''
weight = 2
before_first_edit = true

[[forbid]]
label = "in-place edit of source"
pattern = '''(?s)\b(g?sed|perl)\s+(\S+\s+)*?(-[a-zA-Z]*i\S*|--in-place\S*)\s.*\bsrc/'''

[[forbid]]
label = "script write into source"
pattern = '''(?s)\b(python3?|node|ruby)\b.*src/.*(\.write\(|write_text\(|writeFileSync)|(?s)\b(python3?|node|ruby)\b.*(\.write\(|write_text\(|writeFileSync).*src/'''

[[forbid]]
label = "deleting the caller to make the build pass"
edit_path = '''src/usecases/layout\.rs$'''
